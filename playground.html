<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  var desk = document.getElementById('desk');
  var all = Array.prototype.slice.call(desk.querySelectorAll('.p-item, .p-sticker'));
  all.forEach(function (el) {
    var href = el.getAttribute('data-href');
    if (href) el.setAttribute('data-cursor', 'drag / open');
    window.makeDraggable(el, { bounds: desk, onTap: href ? function () { window.location.href = href; } : null });
  });
  document.getElementById('tidy').addEventListener('click', function () { all.forEach(function (el) { el.resetDrag(); }); });
  document.getElementById('shuffle').addEventListener('click', function () {
    var d = desk.getBoundingClientRect();
    all.forEach(function (el) {
      var r = el.getBoundingClientRect();
      var tx = Math.random() * (d.width - r.width), ty = Math.random() * (d.height - r.height);
      var bx = r.left - d.left - parseFloat(el.dataset.dx || 0), by = r.top - d.top - parseFloat(el.dataset.dy || 0);
      el.dataset.dx = tx - bx; el.dataset.dy = ty - by;
      el.style.translate = (tx - bx) + 'px ' + (ty - by) + 'px';
    });
  });
})();
</script>
