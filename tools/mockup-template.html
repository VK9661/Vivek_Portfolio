<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    width: 1400px; height: 900px; overflow: hidden; position: relative;
    background-color: #F3F0FB;
    background-image: radial-gradient(rgba(28, 23, 71, .14) 1.3px, transparent 1.7px);
    background-size: 28px 28px;
    display: flex; align-items: center; justify-content: center; gap: 70px;
  }
  .phone {
    position: relative; width: 300px; height: 649px; padding: 12px; box-sizing: content-box;
    background: #1C1747; border-radius: 52px; box-shadow: 12px 12px 0 #9DB0FF;
  }
  .phone img { display: block; width: 300px; height: 649px; border-radius: 40px; object-fit: cover; object-position: top; }

  .p2 { transform: translateY(-34px); box-shadow: 12px 12px 0 #FF5A8C; }
  .p3 { box-shadow: 12px 12px 0 #FFCF33; }
  .deco { position: absolute; }
  .star { left: 110px; top: 120px; width: 46px; }
  .burst { right: 120px; bottom: 110px; width: 80px; }
  .plus { left: 150px; bottom: 140px; width: 34px; }
  .spark { right: 150px; top: 130px; width: 40px; }
</style></head>
<body>
  <svg class="deco star" viewBox="0 0 40 40"><path d="M20 0c1.5 11 7 17.5 20 20-13 2.5-18.5 9-20 20-1.5-11-7-17.5-20-20 13-2.5 18.5-9 20-20z" fill="#3350FF"/></svg>
  <svg class="deco spark" viewBox="0 0 40 40"><path d="M20 0c1.5 11 7 17.5 20 20-13 2.5-18.5 9-20 20-1.5-11-7-17.5-20-20 13-2.5 18.5-9 20-20z" fill="#FF5A8C"/></svg>
  <svg class="deco burst" viewBox="0 0 100 100"><path d="M50 4v30M50 66v30M4 50h30M66 50h30M17 17l21 21M62 62l21 21M83 17L62 38M38 62L17 83" stroke="#FFCF33" stroke-width="7" stroke-linecap="round"/></svg>
  <svg class="deco plus" viewBox="0 0 30 30"><path d="M15 3v24M3 15h24" stroke="#6FE3B2" stroke-width="5" stroke-linecap="round"/></svg>
  <div class="phone p1"><img src="m1_home.png" alt=""></div>
  <div class="phone p2"><img src="m2_work.png" alt=""></div>
  <div class="phone p3"><img src="m3_project.png" alt=""></div>
</body></html>
