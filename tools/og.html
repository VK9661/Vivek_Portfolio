<!doctype html>
<!-- 1200 x 630 link-preview template. ?id=<project id> renders a project card; no id renders the portfolio card.
     Rendered to JPG by tools/build-share.py with headless Chrome. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=general-sans@500&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0A0A0B;color:#EDEBE6}
  body{position:relative;font-family:'General Sans',sans-serif}
  .mono{font:400 15px/1.5 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#8E8C87}
  .acc{color:#FF4A1C}
  .grain{position:absolute;inset:0;background:radial-gradient(80% 90% at 85% 50%,rgba(255,74,28,.10),transparent 60%)}
  .l{position:absolute;left:64px;top:56px;bottom:52px;width:560px;display:flex;flex-direction:column}
  .t{font:600 128px/.86 'Clash Display',sans-serif;letter-spacing:-.042em;word-spacing:.1em;margin-top:auto}
  .t.sm{font-size:96px}
  .t.xs{font-size:76px}
  .s{font:500 25px/1.32 'General Sans',sans-serif;letter-spacing:-.01em;margin-top:26px;max-width:24ch}
  .u{margin-top:34px;display:flex;justify-content:space-between;border-top:1px solid #2A2A2E;padding-top:18px}
  .r{position:absolute;right:56px;top:56px;bottom:56px;width:500px;display:grid;place-items:center}
  .r img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 0 0 1px #2A2A2E,0 40px 80px rgba(0,0,0,.6)}
  .me{width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:grayscale(1) contrast(1.05)}
  .dot{display:inline-block;width:.16em;height:.16em;background:#FF4A1C;margin-left:.04em}
</style>
</head>
<body>
<div class="grain"></div>
<div class="l">
  <p class="mono" id="k"></p>
  <h1 class="t" id="t"></h1>
  <p class="s" id="s"></p>
  <div class="u"><span class="mono">vivek-portfolio-beta-eight.vercel.app</span><span class="mono acc" id="n"></span></div>
</div>
<div class="r" id="r"></div>
<script src="../assets/js/data.js"></script>
<script>
  const S = '../', id = new URLSearchParams(location.search).get('id');
  const P = window.PROJECTS, i = P.findIndex(p => p.id === id), p = P[i];
  const $ = s => document.querySelector(s);
  if (p) {
    $('#k').textContent = `( ${p.kind} · ${p.year} )`;
    $('#t').textContent = p.title;
    $('#t').className = 't' + (p.title.length > 11 ? ' xs' : p.title.length > 7 ? ' sm' : '');
    $('#s').textContent = p.summary;
    $('#n').textContent = `Project ${String(i + 1).padStart(2, '0')} / ${P.length}`;
    $('#r').innerHTML = `<img src="${S + p.img}" alt="">`;
  } else {
    $('#k').textContent = '( Portfolio · 2026 )';
    $('#t').innerHTML = 'Vivek<br>Kumar<span class="dot"></span>';
    $('#s').textContent = 'Designer for brands, apps and motion. Graphic, UI/UX, motion and video.';
    $('#n').textContent = `${P.length} projects`;
    $('#r').innerHTML = `<img class="me" src="${S}assets/img/me/portrait.webp" alt="" style="width:400px;height:518px">`;
  }
</script>
</body>
</html>
