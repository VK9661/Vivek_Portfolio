<!doctype html>
<html lang="en">
<head>

<title>Share image</title>
<!-- Source for assets/img/share/portfolio.jpg (1200 × 630), the link preview of the portfolio link.

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Covered+By+Your+Grace&family=Plus+Jakarta+Sans:wght@500..800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  /* mirrors the home hero: cobalt band, paper band, giant name behind the cut-out portrait */
  body { position: relative; font-family: 'Plus Jakarta Sans', sans-serif; color: #1C1747; background: #3350FF; }
  .band { position: absolute; left: 0; right: 0; top: 352px; bottom: 0; background: #FFFFFF; border-top: 3px solid #1C1747; }
  .big { position: absolute; z-index: 1; left: 0; right: 0; bottom: -70px; text-align: center; white-space: nowrap;
    font: 800 430px/.8 'Bricolage Grotesque', sans-serif; font-stretch: 100%; letter-spacing: -.02em; color: #3350FF; }
  .big span { display: inline-block; }
  .big .lift { color: #FF5A8C; translate: 0 -28px; rotate: -7deg; scale: 1.05; text-shadow: 12px 16px 0 #1C1747; }
  .photo { position: absolute; z-index: 2; left: 50%; bottom: 0; height: 540px; translate: -50% 0; }
  .card { position: absolute; z-index: 3; left: 52px; top: 58px; width: 430px; padding: 26px 30px 30px; background: #FAF9F6;
    border: 3px solid #1C1747; border-radius: 26px; box-shadow: 6px 8px 0 #1C1747; rotate: -2.5deg; }
  .card::before { content: ""; position: absolute; top: -16px; left: 42%; width: 110px; height: 30px; rotate: 4deg; background: rgba(255, 207, 51, .92); border: 2px dashed rgba(28, 23, 71, .35); }
  .hi { font: 400 34px 'Covered By Your Grace', cursive; color: #3350FF; }
  .hi b { font: 800 36px 'Bricolage Grotesque', sans-serif; font-stretch: 85%; color: #1C1747; margin-left: 6px; }
  h1 { margin-top: 10px; font: 800 62px/.92 'Bricolage Grotesque', sans-serif; font-stretch: 80%; letter-spacing: -.03em; color: #3350FF; }
  .url { margin-top: 18px; font-weight: 700; font-size: 18px; white-space: nowrap; color: #4A4570; }
  .roles { position: absolute; z-index: 3; right: 52px; top: 48px; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  .roles .hand { font: 400 30px 'Covered By Your Grace', cursive; color: #FFCF33; }
  .pill { padding: 10px 20px; font-weight: 800; font-size: 22px; border: 2.5px solid #1C1747; border-radius: 999px; box-shadow: 3px 4px 0 #1C1747; }
</style>

<body>
  <div class="band"></div>

    <h1>I design brands,<br>apps &amp; motion.</h1>
    <p class="url">vivek-portfolio-beta-eight.vercel.app</p>
  </div>
  <div class="roles">
    <span class="hand">what I do</span>
    <span class="pill" style="background:#FF5A8C;rotate:-4deg">Graphic designer</span>
    <span class="pill" style="background:#FFCF33;rotate:3deg;margin-right:22px">UI/UX designer</span>
    <span class="pill" style="background:#6FE3B2;rotate:-2deg">Motion designer</span>
    <span class="pill" style="background:#7FD8F5;rotate:4deg;margin-right:16px">Video editor</span>
